      touchStart = null;
      touchCurrent = null;
      touchPointerId = null;
    }
  });

  // Indicadores de Combate Compactos (ao lado da pausa)
  drawPixelText(ctx, `BASES:${bases.length}`, 50, 11, 2, '#ff2a55', 'left', '#000000');
  drawPixelText(ctx, `KILLS:${kills}`, 50, 25, 2, '#38bdf8', 'left', '#000000');

  // Barra de NÃ­vel e Progresso de XP
  // No celular: fica estritamente Ã  esquerda do mini mapa (radX) sem jamais passar por baixo dele!
  // No computador: permanece centralizada no topo com folga
  const leftMargin = 10;
  const rightBoundary = isNarrowScreen ? (radX - 10) : (cw - 150);
  const xpW = isNarrowScreen ? (rightBoundary - leftMargin) : Math.min(cw - 300, 340);
  const xpX = isNarrowScreen ? leftMargin : Math.round((cw - xpW) / 2);
  const xpTextY = isNarrowScreen ? 44 : 10;
  const xpBarY = xpTextY + 14;
  const xpH = 8;
  const xpTextX = isNarrowScreen ? leftMargin : (cw / 2);
  const xpAlign = isNarrowScreen ? 'left' : 'center';
  const xpLabel = isNarrowScreen ? `LVL ${player.level} â€¢ XP ${player.xp}/${player.nextXp}` : `PILOTO LVL ${player.level} â€¢ XP ${player.xp}/${player.nextXp}`;

  // Texto nÃ­tido em escala 2 retrÃ´ posicionado acima da barra
  drawPixelText(ctx, xpLabel, xpTextX, xpTextY, 2, '#fde047', xpAlign, '#000000', xpW);

  // Barra de progresso com fundo limpo e bloquinhos ciano neon
  ctx.fillStyle = 'rgba(9, 13, 22, 0.85)';
  ctx.fillRect(xpX, xpBarY, xpW, xpH);
  ctx.strokeStyle = '#334155';
  ctx.lineWidth = 2;
  ctx.strokeRect(xpX, xpBarY, xpW, xpH);

  const xpRatio = Math.min(1, player.xp / player.nextXp);
  const fillW = Math.floor((xpW - 4) * xpRatio);
  ctx.fillStyle = '#38bdf8';
  for (let bx = 0; bx < fillW; bx += 7) {
    ctx.fillRect(xpX + 2 + bx, xpBarY + 2, Math.min(5, fillW - bx), xpH - 4);
  }

  // Faixa de Arsenal TÃ¡tico Ativo (Compacta e contida Ã  esquerda do mini mapa no celular)
  const badges = [];
  if (player.weaponType === 'laser') {
    badges.push({ txt: 'LASER FUSAO', col: '#38bdf8', bg: 'rgba(8, 47, 73, 0.8)' });
  } else {
    badges.push({ txt: `VULCAN MK-${player.bulletCount}`, col: '#60a5fa', bg: 'rgba(23, 37, 84, 0.8)' });
  }
  if (player.missiles > 0) {
    badges.push({ txt: `MISSEIS LV.${player.missiles}`, col: '#f59e0b', bg: 'rgba(69, 26, 3, 0.8)' });
  }
  if (player.bombs > 0) {
    badges.push({ txt: 'CLUSTER BOMBS', col: '#ec4899', bg: 'rgba(80, 7, 36, 0.8)' });
  }
  if (player.shieldCharges > 0) {
    badges.push({ txt: `ESCUDO [${player.shieldCharges}/3]`, col: '#22d3ee', bg: 'rgba(8, 51, 68, 0.8)' });
  }
  if (player.orbitals > 0) {
    badges.push({ txt: `DRONES x${player.orbitals}`, col: '#34d399', bg: 'rgba(6, 78, 59, 0.8)' });
  }
  if (player.dash) {
    if (player.dash.cooldown <= 0) {
      badges.push({ txt: 'HIPER: PRONTO', col: '#38bdf8', bg: 'rgba(8, 47, 73, 0.8)' });
    } else {
      const dashPct = Math.floor((1 - player.dash.cooldown / player.dash.maxCooldown) * 100);
      badges.push({ txt: `HIPER: ${dashPct}%`, col: '#64748b', bg: 'rgba(9, 13, 22, 0.8)' });
    }
  }

  const badgeH = 15;
  const badgeY = xpBarY + xpH + 4;
  let curBadgeX = isNarrowScreen ? leftMargin : xpX;
  const maxBadgeX = isNarrowScreen ? (radX - 10) : (cw - 8);

  badges.forEach((b) => {
    const textW = measurePixelText(b.txt, 1);
    const bw = textW + 8;
    if (curBadgeX + bw <= maxBadgeX) {
      ctx.fillStyle = b.bg;
      ctx.fillRect(curBadgeX, badgeY, bw, badgeH);
      ctx.strokeStyle = b.col;
      ctx.lineWidth = 1;
      ctx.strokeRect(curBadgeX, badgeY, bw, badgeH);
      drawPixelText(ctx, b.txt, curBadgeX + bw / 2, badgeY + 4, 1, b.col, 'center', '#000000');
      curBadgeX += bw + 4;
    }
  });

  // Radar de Longo Alcance (TranslÃºcido para nÃ£o bloquear a visÃ£o do cenÃ¡rio e inimigos)
  ctx.fillStyle = 'rgba(2, 4, 10, 0.72)';
  ctx.fillRect(radX, radY, radSize, radSize);
  ctx.strokeStyle = '#22d3ee';
  ctx.lineWidth = 2;
  ctx.strokeRect(radX, radY, radSize, radSize);

  ctx.fillStyle = '#083344';
  for (let i = 6; i < radSize - 6; i += 4) {
    ctx.fillRect(radX + i, rcy, 2, 2);
    ctx.fillRect(rcx, radY + i, 2, 2);
  }

  const sweepAng = (now * 0.0025) % (Math.PI * 2);
  ctx.fillStyle = 'rgba(34, 211, 238, 0.35)';
  for (let r = 4; r < maxR; r += 4) {
    ctx.fillRect(Math.round(rcx + Math.cos(sweepAng) * r), Math.round(rcy + Math.sin(sweepAng) * r), 3, 3);
  }

  const radarRange = Math.round(WORLD_SIZE * 0.44);

  // Plataformas mecÃ¢nicas no radar (desenhando sub-shapes autÃªnticos: Cruz, H-Bar, Anel, etc.)
  stingerPlatforms.forEach(p => {
    const sub = p.subRects || [{ ox: 0, oy: 0, w: p.w, h: p.h }];
    sub.forEach(sr => {
      const pdx = (getDelta(player.x, p.x + sr.ox) / radarRange) * maxR;
      const pdy = (getDelta(player.y, p.y + sr.oy) / radarRange) * maxR;
      const pw = Math.max(3, (sr.w / radarRange) * maxR);
      const ph = Math.max(3, (sr.h / radarRange) * maxR);
      if (Math.hypot(pdx, pdy) <= maxR + Math.max(pw, ph)) {
        const platCol = biome.id === 'PLANET' ? 'rgba(249, 115, 22, 0.55)' : 
                        (biome.id === 'TRENCH' ? 'rgba(253, 224, 71, 0.55)' : 
                        (biome.id === 'CAVE' ? 'rgba(192, 132, 252, 0.55)' : 'rgba(56, 189, 248, 0.55)'));
        const platBorder = biome.id === 'PLANET' ? '#f97316' : 
                           (biome.id === 'TRENCH' ? '#fde047' : 
                           (biome.id === 'CAVE' ? '#c084fc' : '#38bdf8'));
        ctx.fillStyle = platCol;
        ctx.fillRect(Math.round(rcx + pdx - pw / 2), Math.round(rcy + pdy - ph / 2), Math.round(pw), Math.round(ph));
        ctx.strokeStyle = platBorder;
        ctx.lineWidth = 1;
        ctx.strokeRect(Math.round(rcx + pdx - pw / 2), Math.round(rcy + pdy - ph / 2), Math.round(pw), Math.round(ph));
      }
    });
  });

  // Em CAVERNAS: Rochas no radar para navegaÃ§Ã£o de cÃ¢maras subterrÃ¢neas
  if (biome.id === 'CAVE') {
    caveRocks.forEach(rock => {
      const rdx = (getDelta(player.x, rock.x) / radarRange) * maxR;
      const rdy = (getDelta(player.y, rock.y) / radarRange) * maxR;
      const rockRad = Math.max(2.5, (rock.r / radarRange) * maxR);
      if (Math.hypot(rdx, rdy) <= maxR + rockRad) {
        ctx.fillStyle = 'rgba(192, 132, 252, 0.35)';
        ctx.beginPath();
        ctx.arc(Math.round(rcx + rdx), Math.round(rcy + rdy), Math.round(rockRad), 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = 'rgba(232, 121, 249, 0.7)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }
    });
  }

  // Bases no radar
  bases.forEach(b => {
    const dx = getDelta(player.x, b.x);
    const dy = getDelta(player.y, b.y);
    const dist = Math.hypot(dx, dy);
    const ang = Math.atan2(dy, dx);
    const r = Math.min(maxR, (dist / radarRange) * maxR);
    const rx = Math.round(rcx + Math.cos(ang) * r);
    const ry = Math.round(rcy + Math.sin(ang) * r);
    ctx.fillStyle = (Math.floor(now / 180) % 2 === 0) ? '#ff2a55' : '#fde047';
    ctx.fillRect(rx - 3, ry - 3, 6, 6);
  });

  // CÃ¡psulas de Suprimento
  cuteShips.forEach(cs => {
    const dx = (getDelta(player.x, cs.x) / 1400) * maxR;
    const dy = (getDelta(player.y, cs.y) / 1400) * maxR;
    if (Math.hypot(dx, dy) <= maxR) {
      ctx.fillStyle = '#f472b6';
      ctx.fillRect(Math.round(rcx + dx) - 2, Math.round(rcy + dy) - 2, 4, 4);
    }
  });

  // Inimigos
  enemies.forEach(e => {
    const dx = (getDelta(player.x, e.x) / 1400) * maxR;
    const dy = (getDelta(player.y, e.y) / 1400) * maxR;
    if (Math.hypot(dx, dy) <= maxR) {
      ctx.fillStyle = e.color;
      ctx.fillRect(Math.round(rcx + dx) - 1, Math.round(rcy + dy) - 1, 3, 3);
    }
  });

  // Jogador no centro do radar
  ctx.fillStyle = '#ffffff';
  ctx.fillRect(rcx - 2, rcy - 2, 4, 4);

  // AnimaÃ§Ã£o de Upgrade RetrÃ´ Flutuante: surge na parte inferior, sobe piscando em letras grandes e some rapidamente
  if (levelUpBanner.active) {
    levelUpBanner.timer--;
    const t = 1 - (levelUpBanner.timer / levelUpBanner.maxTime);
    // Subida suave com desaceleraÃ§Ã£o (ease-out cubic)
    const easeOut = 1 - Math.pow(1 - t, 2.8);
    levelUpBanner.y = levelUpBanner.startY - (levelUpBanner.startY - levelUpBanner.targetY) * easeOut;

    if (levelUpBanner.timer <= 0) {
      levelUpBanner.active = false;
    } else {
      const curY = Math.round(levelUpBanner.y);
      // Efeito arcade retrÃ´ piscante rÃ¡pido (pisca a cada 3 frames)
      const isBlink = (Math.floor(levelUpBanner.timer / 3) % 2 === 0);
      const titleCol = isBlink ? '#fde047' : '#ffffff';
      const subCol = isBlink ? '#38bdf8' : '#7dd3fc';

      // Desaparecimento rÃ¡pido nos Ãºltimos 14 frames com fade out
      let alpha = 1.0;
      if (levelUpBanner.timer < 14) {
        alpha = Math.max(0, levelUpBanner.timer / 14);
      }

      ctx.save();
      ctx.globalAlpha = alpha;

      // Escala grande retrÃ´ (escala 3 no celular, escala 4 no computador se houver espaÃ§o)
      const titleScale = (cw < 450) ? 3 : 4;
      const upgradeTitle = `â–² ${levelUpBanner.upgName} â–²`;

      // Se houver sprite da melhoria, desenha centralizado flutuante logo acima
      const spr = SPRITES[levelUpBanner.upgSpr];
      let titleY = curY;
      if (spr) {
        const sprScale = 2;
        const sprW = spr.width * sprScale;
        const sprH = spr.height * sprScale;
        ctx.drawImage(spr, Math.round(cw / 2 - sprW / 2), curY - sprH - 6, sprW, sprH);
      }

      // Nome da melhoria em letras grandes retrÃ´ com sombra arcade espessa
      drawPixelText(ctx, upgradeTitle, cw / 2, titleY, titleScale, titleCol, 'center', '#000000', cw - 20);

      // DescriÃ§Ã£o rÃ¡pida logo abaixo em escala 2 retrÃ´
      const descY = titleY + 6 * titleScale + 2;
      drawPixelText(ctx, levelUpBanner.upgDesc, cw / 2, descY, 2, subCol, 'center', '#000000', cw - 24);

      ctx.restore();
    }
  } else if (alertTimer > 0) {
    alertTimer--;
    if (Math.floor(alertTimer / 10) % 2 === 0) {
      const alertW = Math.min(cw - 24, 480);
      const alertX = Math.round((cw - alertW) / 2);
      const alertY = isNarrowScreen ? 94 : 64;
      ctx.fillStyle = 'rgba(136, 19, 55, 0.85)';
      ctx.fillRect(alertX, alertY, alertW, 24);
      ctx.strokeStyle = '#ff2a55';
      ctx.lineWidth = 1.5;
      ctx.strokeRect(alertX, alertY, alertW, 24);
      drawPixelText(ctx, alertText, cw / 2, alertY + 6, 2, '#fde047', 'center', '#000000', alertW - 12);
    }
  }

  // Barra de Vida / Blindagem (posicionada com margem segura acima da base da tela)
  ctx.fillStyle = '#090d16';
  ctx.fillRect(hpX, hpY, hpW, hpH);
  ctx.strokeStyle = player.hurtFlash > 0 ? '#ff2a55' : '#cbd5e1';
  ctx.lineWidth = 3;
  ctx.strokeRect(hpX, hpY, hpW, hpH);

  const hpRatio = Math.max(0, player.hp / player.maxHp);
  const hpFillW = Math.floor((hpW - 6) * hpRatio);
  ctx.fillStyle = hpRatio > 0.3 ? '#ef4444' : '#fde047';
  for (let bx = 0; bx < hpFillW; bx += 10) {
    ctx.fillRect(hpX + 3 + bx, hpY + 3, Math.min(8, hpFillW - bx), hpH - 6);
  }
  drawPixelText(ctx, `BLINDAGEM ${Math.ceil(player.hp)}/${player.maxHp}`, cw / 2, hpY - 14, 2, '#cbd5e1', 'center', '#000000', hpW);

  // BotÃ£o Touch de Hiper-Impulso / Dash para Celulares e Telas de Toque
  if (isTouchDevice && player.dash) {
    const dashReady = player.dash.cooldown <= 0;
    const btnW = 84, btnH = 34;
    const btnX = Math.round(cw - btnW - 14);
    const btnY = Math.round(hpY - btnH - 10);

    const btnBg = dashReady ? '#083344' : '#090d16';
    const btnBorder = dashReady ? '#38bdf8' : '#334155';
    const btnTxtCol = dashReady ? '#ffffff' : '#64748b';
    const btnLabel = dashReady ? "HIPER" : `${Math.floor((1 - player.dash.cooldown / player.dash.maxCooldown) * 100)}%`;

    ctx.fillStyle = '#000000';
    ctx.fillRect(btnX + 2, btnY + 2, btnW, btnH);
    ctx.fillStyle = btnBg;
    ctx.fillRect(btnX, btnY, btnW, btnH);
    ctx.strokeStyle = btnBorder;
    ctx.lineWidth = 2.5;
    ctx.strokeRect(btnX, btnY, btnW, btnH);

    drawPixelText(ctx, btnLabel, btnX + btnW / 2, btnY + 11, 2, btnTxtCol, 'center', '#000000');

    uiButtons.push({
      x: btnX, y: btnY, w: btnW, h: btnH,
      onClick: () => {
        triggerHyperVelocity();
      }
    });
  }

  if (touchStart && touchCurrent) {
    const jx = Math.round(touchStart.x);
    const jy = Math.round(touchStart.y);
    ctx.strokeStyle = 'rgba(56, 189, 248, 0.5)';
    ctx.lineWidth = 3;
    ctx.strokeRect(jx - 44, jy - 44, 88, 88);

    const dx = touchCurrent.x - touchStart.x;
    const dy = touchCurrent.y - touchStart.y;
    const dist = Math.min(Math.hypot(dx, dy), 44);
    const ang = Math.atan2(dy, dx);
    const kx = Math.round(jx + Math.cos(ang) * dist);
    const ky = Math.round(jy + Math.sin(ang) * dist);

    ctx.fillStyle = '#38bdf8';
    ctx.fillRect(kx - 16, ky - 16, 32, 32);
    ctx.strokeStyle = '#ffffff';
    ctx.strokeRect(kx - 16, ky - 16, 32, 32);
  }
}

function spawnCuteCarrier(now) {
  if (sectorClearCountdown.active) return;
  if (crabBotsSpawnedInSector >= MAX_CRAB_BOTS_PER_SECTOR) return;
  if (now - lastCuteShipSpawn < 22000 || cuteShips.length >= 1) return;
  lastCuteShipSpawn = now;
  crabBotsSpawnedInSector++;

  const angle = Math.random() * Math.PI * 2;
  const maxHalfScreen = Math.max(cw, ch) * 0.55 + 50;
  const dist = Math.max(380, maxHalfScreen) + Math.random() * 80;
  const sx = wrapCoord(player.x + Math.cos(angle) * dist);
  const sy = wrapCoord(player.y + Math.sin(angle) * dist);

  const moveAngle = angle + Math.PI + (Math.random() - 0.5) * 0.7;
  const capsuleHp = 300 + (sectorLevel - 1) * 85;
  cuteShips.push({
    x: sx,
    y: sy,
    baseAngle: moveAngle,
    angle: moveAngle,
    spinAngle: 0,
    speed: 1.95,
    hp: capsuleHp,
    maxHp: capsuleHp,
    r: 23,
    hitFlash: 0,
    wavePhase: Math.random() * 10,
    lifeTimer: 1600
  });
}

function drawRotatingMetalCapsule(ctx, x, y, now, phase = 0) {
  ctx.save();
  ctx.translate(Math.round(x), Math.round(y));

  const rot = Math.floor(((now * 0.006 + phase) % (Math.PI * 2)) / (Math.PI / 6)) * (Math.PI / 6);
  ctx.rotate(rot);

  ctx.fillStyle = '#03060c';
  ctx.fillRect(-11, -7, 22, 14);
  ctx.fillRect(-13, -5, 26, 10);

  ctx.fillStyle = '#ff2a55';
  ctx.fillRect(-11, -5, 10, 8);
  ctx.fillStyle = '#881337';
  ctx.fillRect(-11, 3, 10, 2);

  ctx.fillStyle = '#334155';
  ctx.fillRect(-1, -5, 2, 10);

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(1, -5, 10, 8);
  ctx.fillStyle = '#94a3b8';
  ctx.fillRect(1, 3, 10, 2);

  ctx.fillStyle = '#ffffff';
  ctx.fillRect(-9, -4, 6, 2);

  ctx.restore();

  if (Math.floor(now / 110) % 2 === 0) {
    ctx.fillStyle = '#ff2a55';
    ctx.fillRect(Math.round(x) - 14, Math.round(y) - 1, 3, 3);
    ctx.fillRect(Math.round(x) + 12, Math.round(y) - 1, 3, 3);
  } else {
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(Math.round(x) - 1, Math.round(y) - 14, 3, 3);
    ctx.fillRect(Math.round(x) - 1, Math.round(y) + 12, 3, 3);
  }
}

function startNewGame(keepProgress = false, forcedSector = null) {
  resize();
  if (forcedSector !== null) {
    sectorLevel = forcedSector;
  } else if (!keepProgress) {
    sectorLevel = selectedStartingSector || 1;
  } else {
    sectorLevel++;
  }

  if (!keepProgress) {
    player.level = Math.max(1, sectorLevel);
    player.xp = 0;
    player.nextXp = Math.min(26, 10 + (player.level - 1) * 3);
    player.maxHp = 100 + (sectorLevel - 1) * 10;
    player.hp = player.maxHp;
    player.speed = 5.4 + Math.min(1.2, (sectorLevel - 1) * 0.22);
    player.fireRate = Math.max(130, 215 - (sectorLevel - 1) * 16);
    player.bulletCount = sectorLevel >= 3 ? 2 : 1;
    player.bulletDamage = 30 + (sectorLevel - 1) * 5;
    player.weaponType = sectorLevel >= 4 ? 'laser' : 'vulcan';
    player.missiles = sectorLevel >= 2 ? (sectorLevel >= 5 ? 2 : 1) : 0;
    player.bombs = sectorLevel >= 3 ? 1 : 0;
    player.shieldCharges = sectorLevel >= 4 ? 3 : 0;
    player.orbitals = sectorLevel >= 5 ? 1 : 0;
    kills = 0;
  } else {
    player.hp = player.maxHp;
    player.shieldCharges = Math.max(player.shieldCharges, 2);
  }

  const stationCount = Math.min(9, 1 + sectorLevel);
  updateWorldSizeForStations(stationCount);

  player.x = WORLD_SIZE / 2;
  player.y = WORLD_SIZE / 2;
  player.angle = -Math.PI / 2;
  player.vx = 0;
  player.vy = -player.speed;
  moveDir = { x: 0, y: -1 };
  touchPointerId = null;
  touchStart = null;
  touchCurrent = null;
  player.hurtFlash = 0;
  player.invulnFrames = 0;
  player.dash.active = false;
  player.dash.timer = 0;
  player.dash.cooldown = 0;
  player.afterimages = [];
  levelUpBanner.active = false;
  sectorClearCountdown.active = false;

  bullets = [];
  enemyBullets = [];
  enemies = [];
  cuteShips = [];
  armorCapsules = [];
  gems = [];
  particles = [];
  shockwaves = [];
  floatingTexts = [];
  floatingMines = [];
  crabBotsSpawnedInSector = 0;
  gameStartTime = performance.now();
  lastCuteShipSpawn = performance.now() - 10000;

  hordeState.waveNumber = 0;
  hordeState.lastSpawnAt = 0;
  hordeState.squads = [];

  initBiomeWorld();
  initStingerPlatforms();
  initBases(stationCount);
  spawnEnemies(performance.now(), true);

  gameState = 'WARP_IN';
  warpState.timer = warpState.maxTime;
  warpState.arrivedSfxPlayed = false;
  warpState.shipOffsetY = ch * 0.65;
  player.angle = -Math.PI / 2;
  playSfx('warpIn');
}

function loop(now) {
  requestAnimationFrame(loop);
  uiButtons = [];

  updateArcadeMusic(now);

  if (screenShake.power > 0.2) {
    screenShake.x = (Math.random() - 0.5) * screenShake.power;
    screenShake.y = (Math.random() - 0.5) * screenShake.power;
    screenShake.power *= 0.85;
  } else {
    screenShake.x = 0; screenShake.y = 0; screenShake.power = 0;
  }

  ctx.clearRect(0, 0, cw, ch);

  if (gameState === 'WARP_IN') {
    renderWarpIn(now);
    drawHUD(now);
    return;
  }

  const vx = gameState === 'PLAYING' ? player.vx : 0.8;
  const vy = gameState === 'PLAYING' ? player.vy : -0.5;
  drawStarfield(now, vx, vy, false, 1);
  drawBiomeBackground(now);

  if (gameState !== 'PLAYING') {
    renderMenuScreens(now);
    return;
  }

  if (player.hurtFlash > 0) player.hurtFlash--;
  if (player.invulnFrames > 0) player.invulnFrames--;

  updateKeyboardInput();

  // 1. AtualizaÃ§Ã£o da FÃ­sica de Hiper-Impulso / Dash
  if (player.dash.active) {
    player.dash.timer--;
    player.vx = player.dash.vx;
    player.vy = player.dash.vy;
    player.x = wrapCoord(player.x + player.vx);
    player.y = wrapCoord(player.y + player.vy);

    // Afterimages do dash a cada frame
    player.afterimages.push({
      x: player.x,
      y: player.y,
      alpha: 0.88,
      isPink: (player.dash.timer % 2 === 0)
    });

    // Rastro massivo e contÃ­nuo durante o hiper-impulso
    spawnPlayerThrusterTrail(true);

    if (player.dash.timer <= 0) {
      player.dash.active = false;
      player.vx *= 0.60;
      player.vy *= 0.60;
    }
  } else {
    // Voo normal
    player.vx = player.vx * 0.88 + (moveDir.x * player.speed) * 0.12;
    player.vy = player.vy * 0.88 + (moveDir.y * player.speed) * 0.12;
    player.x = wrapCoord(player.x + player.vx);
    player.y = wrapCoord(player.y + player.vy);

    // Rastro vibrante dos propulsores da nave
    if (Math.hypot(player.vx, player.vy) > 0.6) {
      spawnPlayerThrusterTrail(false);
    }
  }

  if (player.dash.cooldown > 0) {
    player.dash.cooldown--;
  }

  // AtualizaÃ§Ã£o das afterimages de hiper-velocidade
  for (let i = player.afterimages.length - 1; i >= 0; i--) {
    const ai = player.afterimages[i];
    ai.alpha -= 0.07;
    if (ai.alpha <= 0) player.afterimages.splice(i, 1);
  }

  // --- COLISÃƒO COM ROCHAS DE CAVERNA (QUIQUE ELÃSTICO COM FAÃSCAS VISÃVEIS) ---
  const biome = getCurrentBiome();
  if (biome.id === 'CAVE') {
    caveRocks.forEach(rock => {
      const d = getDist(player.x, player.y, rock.x, rock.y);
      const hitRadius = (rock.hitR || Math.round(rock.r * 0.72)) + player.r;
      if (d < hitRadius) {
        const recoilAng = getAngle(rock.x, rock.y, player.x, player.y);
        player.vx = Math.cos(recoilAng) * 6.5;
        player.vy = Math.sin(recoilAng) * 6.5;
        player.x = wrapCoord(player.x + Math.cos(recoilAng) * 16);
        player.y = wrapCoord(player.y + Math.sin(recoilAng) * 16);
        const hitX = wrapCoord(player.x - Math.cos(recoilAng) * 12);
        const hitY = wrapCoord(player.y - Math.sin(recoilAng) * 12);
        damagePlayer(8, true, hitX, hitY);
        spawnPixelParticles(hitX, hitY, ['#c084fc', '#e879f9', '#ffffff'], 16, 1.4);
        spawnShockwave(hitX, hitY, '#c084fc', 35);
        addShake(6);
      }
    });
  }

  // --- COLISÃƒO COM PORTÃ•ES DE PLASMA (TRINCHEIRAS - FEIXE ROTACIONADO PRECISO) ---
  if (biome.id === 'TRENCH') {
    laserGates.forEach(gate => {
      const t = (now + gate.offsetTime) % gate.cycleTime;
      const isActive = (t < gate.onDuration);
      if (isActive) {
        const dx = getDelta(gate.x, player.x);
        const dy = getDelta(gate.y, player.y);
        // TransformaÃ§Ã£o para o espaÃ§o local do portÃ£o (rotacionado pelo Ã¢ngulo do emissor)
        const cos = Math.cos(-gate.angle);
        const sin = Math.sin(-gate.angle);
        const localX = dx * cos - dy * sin;
        const localY = dx * sin + dy * cos;
        // O feixe laser Ã© desenhado de -len/2 a +len/2 ao longo do eixo local X, com espessura 14px no eixo local Y
        if (Math.abs(localX) <= gate.len / 2 + player.r && Math.abs(localY) <= 14 + player.r) {
          const recoilSign = localY >= 0 ? 1 : -1;
          const recoilAngle = gate.angle + (recoilSign * Math.PI / 2);
          player.vx = Math.cos(recoilAngle) * 6.8;
          player.vy = Math.sin(recoilAngle) * 6.8;
          player.x = wrapCoord(player.x + Math.cos(recoilAngle) * 18);
          player.y = wrapCoord(player.y + Math.sin(recoilAngle) * 18);
          damagePlayer(gate.damage, true, player.x, player.y);
          spawnShockwave(player.x, player.y, '#ff2a55', 45);
          spawnPixelParticles(player.x, player.y, ['#ff2a55', '#fde047', '#ffffff'], 20, 1.5);
          addShake(8);
        }
      }
    });
  }


  // --- 2. PLATAFORMAS MECÃ‚NICAS, PORTÃ•ES LASER E TORRETAS DE SUPERFÃCIE ---
  drawStingerPlatforms();
  drawLaserGates(now);

  const platTurretCooldown = Math.max(1500, 2350 - (sectorLevel - 1) * 180);
  platformTurrets.forEach(pt => {
    const pos = toScreen(pt.x, pt.y);
    if (pos.x > -70 && pos.x < cw + 70 && pos.y > -70 && pos.y < ch + 70) {
      if (pt.alive) {
        pt.angle = getAngle(pt.x, pt.y, player.x, player.y);
        ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
        ctx.fillRect(pos.x - 18 + 7, pos.y - 18 + 9, 36, 36);
        ctx.drawImage(SPRITES.platTurretBase, pos.x - SPRITES.platTurretBase.width / 2, pos.y - SPRITES.platTurretBase.height / 2);

        ctx.save();
        ctx.translate(pos.x, pos.y);
        ctx.rotate(pt.angle);
        ctx.drawImage(SPRITES.platTurretGun, -SPRITES.platTurretGun.width / 2, -SPRITES.platTurretGun.height / 2);
        if (pt.hitFlash > 0) {
          pt.hitFlash--;
          ctx.fillStyle = '#ffffff';
          ctx.fillRect(-16, -16, 32, 32);
        }
        ctx.restore();

        if (pt.hp < pt.maxHp) {
          const barW = 40;
          ctx.fillStyle = '#020617';
          ctx.fillRect(pos.x - barW / 2 - 2, pos.y - 30, barW + 4, 7);
          ctx.fillStyle = '#10b981';
          ctx.fillRect(pos.x - barW / 2, pos.y - 28, Math.round(barW * (pt.hp / pt.maxHp)), 3);
        }
      } else {
        ctx.drawImage(SPRITES.platTurretDead, pos.x - SPRITES.platTurretDead.width / 2, pos.y - SPRITES.platTurretDead.height / 2);
      }
    }

    if (pt.alive && !sectorClearCountdown.active) {
      const distToPt = getDist(player.x, player.y, pt.x, pt.y);
      if (distToPt < player.r + pt.r) {
        const recoilAng = getAngle(pt.x, pt.y, player.x, player.y);
        player.vx = Math.cos(recoilAng) * 6.2;
        player.vy = Math.sin(recoilAng) * 6.2;
        player.x = wrapCoord(player.x + Math.cos(recoilAng) * 12);
        player.y = wrapCoord(player.y + Math.sin(recoilAng) * 12);
        pt.hp -= 20;
        pt.hitFlash = 5;
        damagePlayer(14, true, wrapCoord(player.x - Math.cos(recoilAng) * 10), wrapCoord(player.y - Math.sin(recoilAng) * 10));
      } else if (distToPt < 490 && now - pt.lastShot > platTurretCooldown) {
        pt.lastShot = now + Math.random() * 350;
        playSfx('enemyShot');
        const aim = getAngle(pt.x, pt.y, player.x, player.y);
        for (let side = -1; side <= 1; side += 2) {
          const shotAng = aim + side * 0.14;
          enemyBullets.push({
            kind: 'wave_blade',
            x: wrapCoord(pt.x + Math.cos(aim) * 18),
            y: wrapCoord(pt.y + Math.sin(aim) * 18),
            vx: Math.cos(shotAng) * 4.8,
            vy: Math.sin(shotAng) * 4.8,
            ang: shotAng,
            spin: side * 0.8,
            spinSpeed: side * 0.26,
            size: 11,
            color: '#10b981',
            secondaryColor: '#38bdf8',
            coreColor: '#fde047',
            damage: 11,
            range: 490
          });
        }
      }
    }
  });

  // --- 3. SETAS INDICADORAS DE FORTALEZAS NO LIMITE DA TELA ---
  bases.forEach(b => {
    const pos = toScreen(b.x, b.y);
    if (pos.x < 0 || pos.x > cw || pos.y < 0 || pos.y > ch) {
      const ang = Math.atan2(pos.y - ch / 2, pos.x - cw / 2);
      const pad = 26;
      const ix = Math.round(Math.max(pad, Math.min(cw - pad, cw / 2 + Math.cos(ang) * (cw / 2 - pad))));
      const iy = Math.round(Math.max(pad + 135, Math.min(ch - pad - 45, ch / 2 + Math.sin(ang) * (ch / 2 - pad))));

      ctx.fillStyle = '#ff2a55';
      ctx.fillRect(ix - 5, iy - 5, 10, 10);
      ctx.fillStyle = '#fde047';
      ctx.fillRect(ix - 2, iy - 2, 4, 4);
    }
  });

  // --- 4. FORTALEZAS ESPACIAIS ESCALÃVEIS ---
  for (let i = bases.length - 1; i >= 0; i--) {
    const b = bases[i];
    b.angle += b.dying ? 0.012 : 0.0028;

    if (b.dying) {
      b.dyingTimer--;
      if (b.dyingTimer % 7 === 0) {
        const rx = wrapCoord(b.x + (Math.random() - 0.5) * 180);
        const ry = wrapCoord(b.y + (Math.random() - 0.5) * 180);
        playSfx('subExplosion');
        addShake(9);
        spawnPixelParticles(rx, ry, ['#ff2a55', '#f97316', '#fde047', '#ffffff'], 22, 1.6);
        spawnShockwave(rx, ry, (b.dyingTimer % 14 === 0) ? '#fde047' : '#ff2a55', 65);
      }
      if (b.dyingTimer <= 0) {
        finalizeStationDestruction(i);
        if (gameState !== 'PLAYING') return;
        continue;
      }
    }

    const pos = toScreen(b.x, b.y);
    const alivePodsCount = b.pods.filter(p => p.alive).length;
    const isCoreShielded = (alivePodsCount > 0) && !b.dying;

    if (pos.x > -260 && pos.x < cw + 260 && pos.y > -260 && pos.y < ch + 260) {
      const jx = b.dying ? (Math.random() - 0.5) * 14 : 0;
      const jy = b.dying ? (Math.random() - 0.5) * 14 : 0;

      const stationSpr = (SPRITES.stationBodies && (SPRITES.stationBodies[b.shapeIdx] || SPRITES.stationBodies[0])) || null;
      const stationShadowSpr = (SPRITES.stationShadows && (SPRITES.stationShadows[b.shapeIdx] || SPRITES.stationShadows[0])) || null;

      ctx.save();
      ctx.translate(pos.x + jx + SHADOW_OFFSET_X + 6, pos.y + jy + SHADOW_OFFSET_Y + 6);
      ctx.rotate(b.angle);
      if (stationShadowSpr) {
        ctx.drawImage(stationShadowSpr, -stationShadowSpr.width / 2, -stationShadowSpr.height / 2);
      }
      ctx.restore();

      ctx.save();
      ctx.translate(pos.x + jx, pos.y + jy);
      ctx.rotate(b.angle);

      if (stationSpr) {
        ctx.drawImage(stationSpr, -stationSpr.width / 2, -stationSpr.height / 2);
      }

      const coreCol = (b.coreFlash > 0 || b.dying) ? '#ffffff' : ((Math.floor(now / 120) % 2 === 0) ? '#ff2a55' : '#f97316');
      if (b.coreFlash > 0) b.coreFlash--;
      ctx.fillStyle = coreCol;
      ctx.fillRect(-18, -18, 36, 36);
      ctx.fillStyle = '#fde047';
      ctx.fillRect(-12, -12, 24, 24);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(-6, -6, 12, 12);

      if (isCoreShielded) {
        ctx.strokeStyle = (Math.floor(now / 100) % 2 === 0) ? '#38bdf8' : '#0284c7';
        ctx.lineWidth = 4;
        ctx.strokeRect(-26, -26, 52, 52);
      }

      for (let p = 0; p < b.pods.length; p++) {
        const pod = b.pods[p];
        ctx.save();
        ctx.translate(pod.lx, pod.ly);
        ctx.rotate(pod.localAng);
        if (pod.alive) {
          ctx.drawImage(SPRITES.turretAlive, -SPRITES.turretAlive.width / 2, -SPRITES.turretAlive.height / 2);
          if (pod.hitFlash > 0) {
            pod.hitFlash--;
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-15, -15, 30, 30);
          }
        } else {
          ctx.drawImage(SPRITES.turretDead, -SPRITES.turretDead.width / 2, -SPRITES.turretDead.height / 2);
        }
        ctx.restore();
      }

      ctx.restore();

      if (!b.dying) {
        const bw = 128;
        ctx.fillStyle = '#020617';
        ctx.fillRect(pos.x - bw / 2 - 2, pos.y - b.r - 28, bw + 4, 12);
        ctx.fillStyle = isCoreShielded ? '#38bdf8' : '#ff2a55';
        ctx.fillRect(pos.x - bw / 2, pos.y - b.r - 26, Math.round(bw * (b.coreHp / b.coreMaxHp)), 8);
      }
    }

    const distToStation = getDist(player.x, player.y, b.x, b.y);
    if (!b.dying && distToStation < player.r + b.r * 0.72) {
      const recoilAng = getAngle(b.x, b.y, player.x, player.y);
      player.vx = Math.cos(recoilAng) * 6.8;
      player.vy = Math.sin(recoilAng) * 6.8;
      player.x = wrapCoord(player.x + Math.cos(recoilAng) * 14);
      player.y = wrapCoord(player.y + Math.sin(recoilAng) * 14);
      damagePlayer(18, true, wrapCoord(player.x - Math.cos(recoilAng) * 12), wrapCoord(player.y - Math.sin(recoilAng) * 12));
      if (gameState !== 'PLAYING') return;
    }

    if (!b.dying && distToStation < 540) {
      const podCooldown = Math.max(1550, 2500 - (sectorLevel - 1) * 200);
      b.pods.forEach(pod => {
        if (pod.alive && now - pod.lastShot > podCooldown) {
          pod.lastShot = now + Math.random() * 350;
          const pPos = getPodWorldPos(b, pod.index);
          const aim = getAngle(pPos.x, pPos.y, player.x, player.y);
          enemyBullets.push({
            kind: 'plasma',
            x: pPos.x, y: pPos.y,
            vx: Math.cos(aim) * 4.5,
            vy: Math.sin(aim) * 4.5,
            ang: aim,
            size: 9,
            color: '#ff2a55',
            coreColor: '#fde047',
            damage: 13,
            range: 540
          });
        }
      });
    }
  }

  // --- 5. CÃPSULAS DE SUPRIMENTO BICOLORES ---
  spawnCuteCarrier(now);
  for (let i = cuteShips.length - 1; i >= 0; i--) {
    const cs = cuteShips[i];
    cs.lifeTimer--;
    cs.wavePhase += 0.065;
    cs.angle = cs.baseAngle + Math.sin(cs.wavePhase) * 0.45;
    cs.spinAngle = (cs.spinAngle || 0) + 0.042;
    cs.x = wrapCoord(cs.x + Math.cos(cs.angle) * cs.speed);
    cs.y = wrapCoord(cs.y + Math.sin(cs.angle) * cs.speed);

    const pos = toScreen(cs.x, cs.y);
    if (pos.x > -70 && pos.x < cw + 70 && pos.y > -70 && pos.y < ch + 70) {
      if (isOverPlatform(cs.x, cs.y)) {
        ctx.save();
        ctx.translate(pos.x + SHADOW_OFFSET_X, pos.y + SHADOW_OFFSET_Y);
        ctx.rotate(cs.spinAngle);
        ctx.drawImage(SPRITES.cuteCarrierShadow, -SPRITES.cuteCarrierShadow.width / 2, -SPRITES.cuteCarrierShadow.height / 2);
        ctx.restore();
      }

      const pillSpr = (Math.floor(now / 160) % 2 === 0) ? SPRITES.cuteCarrier : SPRITES.cuteCarrier2;
      ctx.save();
      ctx.translate(pos.x, pos.y);
      ctx.rotate(cs.spinAngle);
      ctx.drawImage(pillSpr, -pillSpr.width / 2, -pillSpr.height / 2);
      if (cs.hitFlash > 0) {
        cs.hitFlash--;
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(-pillSpr.width / 2, -pillSpr.height / 2, pillSpr.width, pillSpr.height);
      }
      ctx.restore();

      if (cs.hp < cs.maxHp) {
        const barW = 54;
        ctx.fillStyle = '#020617';
        ctx.fillRect(pos.x - barW / 2 - 2, pos.y - 34, barW + 4, 8);
        ctx.fillStyle = '#ff2a55';
        ctx.fillRect(pos.x - barW / 2, pos.y - 32, Math.round(barW * (cs.hp / cs.maxHp)), 4);
      }
    }

    if (cs.hp <= 0) {
      playSfx('cutePop');
      addShake(8);
      spawnPixelParticles(cs.x, cs.y, ['#ff2a55', '#f97316', '#fde047', '#10b981', '#ffffff'], 34, 1.5);
      spawnShockwave(cs.x, cs.y, '#10b981', 65);
      armorCapsules.push({ x: cs.x, y: cs.y, phase: Math.random() * 6 });
      for (let g = 0; g < 2; g++) {
        gems.push({
          x: wrapCoord(cs.x + (g === 0 ? -18 : 18)),
          y: wrapCoord(cs.y + (Math.random() - 0.5) * 16),
          xp: 5,
          seed: g
        });
      }
      floatingTexts.push({ x: cs.x, y: cs.y - 20, txt: "CAPSULA + ENERGIA!", col: '#10b981', a: 1.6 });
      cuteShips.splice(i, 1);
      continue;
    }

    if (cs.lifeTimer <= 0 || getDist(player.x, player.y, cs.x, cs.y) > 1350) {
      cuteShips.splice(i, 1);
    }
  }

  // --- 6. CÃPSULAS ROTATIVAS DE BLINDAGEM ---
  for (let i = armorCapsules.length - 1; i >= 0; i--) {
    const cap = armorCapsules[i];
    const d = getDist(player.x, player.y, cap.x, cap.y);
    if (d < 150) {
      const ang = getAngle(cap.x, cap.y, player.x, player.y);
      cap.x = wrapCoord(cap.x + Math.cos(ang) * 5.2);
      cap.y = wrapCoord(cap.y + Math.sin(ang) * 5.2);
    }

    const pos = toScreen(cap.x, cap.y);
    if (pos.x > -30 && pos.x < cw + 30 && pos.y > -30 && pos.y < ch + 30) {
      drawRotatingMetalCapsule(ctx, pos.x, pos.y, now, cap.phase);
    }

    if (d < player.r + 12) {
      playSfx('capsulePickup');
      player.maxHp += 5;
      const healAmt = 25;
      player.hp = Math.min(player.maxHp, player.hp + healAmt);
      spawnShockwave(player.x, player.y, '#10b981', 75);
      spawnPixelParticles(player.x, player.y, ['#10b981', '#ffffff', '#fde047'], 18, 1.2);
      floatingTexts.push({
        x: player.x, y: player.y - 24,
        txt: `+${healAmt} BLINDAGEM!`,
        col: '#10b981', a: 1.5
      });
      armorCapsules.splice(i, 1);
    }
  }

  // --- 7. MINAS FLUTUANTES ---
  for (let i = floatingMines.length - 1; i >= 0; i--) {
    const mine = floatingMines[i];
    const d = getDist(player.x, player.y, mine.x, mine.y);
    if (d < 160) {
      const ang = getAngle(mine.x, mine.y, player.x, player.y);
      mine.x = wrapCoord(mine.x + Math.cos(ang) * 1.8);
      mine.y = wrapCoord(mine.y + Math.sin(ang) * 1.8);
    }

    const pos = toScreen(mine.x, mine.y);
    if (pos.x > -30 && pos.x < cw + 30 && pos.y > -30 && pos.y < ch + 30) {
      ctx.drawImage(SPRITES.mine, pos.x - SPRITES.mine.width / 2, pos.y - SPRITES.mine.height / 2);
    }

    if (d < player.r + mine.r) {
      playSfx('explosion');
      addShake(12);
      spawnShockwave(mine.x, mine.y, '#ff2a55', 70);
      spawnPixelParticles(mine.x, mine.y, ['#ff2a55', '#fde047', '#ffffff'], 22, 1.4);
      damagePlayer(18, true);
      floatingMines.splice(i, 1);
      continue;
    }

    if (mine.hp <= 0) {
      playSfx('explosion');
      addShake(8);
      spawnShockwave(mine.x, mine.y, '#fde047', 60);

      // Dano em Ã¡rea nos inimigos prÃ³ximos
      enemies.forEach(en => {
        if (getDist(mine.x, mine.y, en.x, en.y) < 95) {

  }

  // --- 8. HORDAS GALAGA E COMPORTAMENTO DE INIMIGOS ---
  for (let s = hordeState.squads.length - 1; s >= 0; s--) {
    const sq = hordeState.squads[s];
    if (now - sq.spawnTime > 2600) {
      hordeState.squads.splice(s, 1);
      continue;
    }
    sq.heading += sq.curveRate;
    sq.rotAngle += 0.045;
    sq.centerX = wrapCoord(sq.centerX + Math.cos(sq.heading) * sq.entrySpeed);
    sq.centerY = wrapCoord(sq.centerY + Math.sin(sq.heading) * sq.entrySpeed);
  }

  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];

    if (!e.released) {
      const sq = e.squad;
      const timeInSquad = sq ? (now - sq.spawnTime) : 9999;
      const distSqToP = sq ? getDist(sq.centerX, sq.centerY, player.x, player.y) : 0;

      if (!sq || timeInSquad >= e.releaseDelay || distSqToP < 175) {
        e.released = true;
        const baseDir = sq ? sq.heading : getAngle(e.x, e.y, player.x, player.y);
        e.flightAngle = baseDir + e.peelAngle;
        e.roamHeading = e.flightAngle;
      } else {
        const slotPos = getFormationSlotWorldPos(e);
        e.x = wrapCoord(e.x + getDelta(e.x, slotPos.x) * 0.34);
        e.y = wrapCoord(e.y + getDelta(e.y, slotPos.y) * 0.34);
        e.angle = sq.heading;
      }
    }

    if (e.released) {
      const distToP = getDist(e.x, e.y, player.x, player.y);
      const angToP = getAngle(e.x, e.y, player.x, player.y);

      // Comportamento especial do Kamikaze (Striker)
      if (e.type === 'striker') {
        if (!e.isCharging && distToP < 380) {
          e.isCharging = true;
          e.chargeAngle = angToP;
          playSfx('kamikazeAlert');
        }
        if (e.isCharging) {
          e.flightAngle = e.chargeAngle;
          e.speed = 4.8;
          // PartÃ­culas de exaustÃ£o em chamas
          if (Math.random() < 0.6) {
            particles.push({
              x: e.x, y: e.y,
              vx: -Math.cos(e.flightAngle) * 1.5,
              vy: -Math.sin(e.flightAngle) * 1.5,
              size: 4,
              color: Math.random() < 0.5 ? '#f97316' : '#ff2a55',
              alpha: 0.8,
              decay: 0.08
            });
          }
        }
      }

      e.behaviorTimer--;
      if (e.behaviorTimer <= 0 && !e.isCharging) {
        if (Math.random() < 0.28) {
          e.mode = 'dive';
          e.behaviorTimer = 60 + Math.floor(Math.random() * 45);
        } else {
          e.mode = 'roam';
          e.behaviorTimer = 95 + Math.floor(Math.random() * 80);
          e.roamHeading = angToP + (Math.random() < 0.5 ? 1 : -1) * (0.65 + Math.random() * 1.15);
          e.curveDrift = (Math.random() < 0.5 ? 1 : -1) * (0.008 + Math.random() * 0.012);
        }
      }

      let desiredAng;
      if (e.isCharging) {
        desiredAng = e.chargeAngle;
      } else if (distToP > 640) {
        desiredAng = angToP + Math.sin(now * 0.005 + e.swoopPhase) * 0.55;
        e.roamHeading = desiredAng;
      } else if (e.mode === 'dive') {
        desiredAng = angToP + Math.sin(now * 0.007 + e.swoopPhase) * 0.48;
        if (distToP < 145) {
          e.mode = 'roam';
          e.behaviorTimer = 105;
          e.roamHeading = e.flightAngle + (e.curveDrift > 0 ? 1.25 : -1.25);
        }
      } else {
        e.roamHeading += e.curveDrift;
        desiredAng = e.roamHeading + Math.sin(now * 0.006 + e.swoopPhase) * 0.35;
      }

      const diff = Math.atan2(Math.sin(desiredAng - e.flightAngle), Math.cos(desiredAng - e.flightAngle));
      e.flightAngle += diff * (e.isCharging ? 0.02 : 0.065);

      const vx = Math.cos(e.flightAngle) * e.speed;
      const vy = Math.sin(e.flightAngle) * e.speed;
      e.x = wrapCoord(e.x + vx);
      e.y = wrapCoord(e.y + vy);
      e.angle = Math.atan2(vy, vx);
    }

    const distToP = getDist(e.x, e.y, player.x, player.y);
    fireEnemyWeapon(e, now);

    const pos = toScreen(e.x, e.y);
    if (pos.x > -70 && pos.x < cw + 70 && pos.y > -70 && pos.y < ch + 70) {
      if (isOverPlatform(e.x, e.y)) {
        const shadowSpr = SPRITES[e.type + 'Shadow'];
        if (shadowSpr) {

    // ColisÃ£o direta com a nave do jogador
    if (distToP < player.r + e.r + 3) {

  // --- 9. TIROS DO JOGADOR ---
  const applyBulletAoE = (bx, by, radius, aoeDmg) => {

  const triggerBulletDetonation = (b) => {

  for (let i = bullets.length - 1; i >= 0; i--) {

          if (b.kind === 'laser_beam') {

    if (!hit) {
      for (let g = shieldGenerators.length - 1; g >= 0; g--) {

          pt.hitFlash = 3;
          playSfx('hit');
          spawnPixelParticles(b.x, b.y, ['#10b981', '#38bdf8', '#ffffff'], 6, 0.7);
          floatingTexts.push({ x: pt.x, y: pt.y - 16, txt: `${b.damage}`, col: '#10b981', a: 1 });
          hit = true;
          if (b.kind === 'laser_beam') {
            b.pierce = (b.pierce !== undefined ? b.pierce : 3) - 1;
            if (b.pierce > 0) hit = false;
          }

          if (pt.hp <= 0) {
            pt.alive = false;
            playSfx('turretBoom');
            addShake(11);
            spawnPixelParticles(pt.x, pt.y, ['#10b981', '#38bdf8', '#fde047', '#ffffff'], 32, 1.5);
            spawnShockwave(pt.x, pt.y, '#fde047', 65);
            kills += 2;
            gems.push({ x: pt.x, y: pt.y, xp: 5, seed: ptIdx, spawnTime: now, sizeMul: 1.5 });
            floatingTexts.push({ x: pt.x, y: pt.y - 20, txt: "TORRETA DESTRUIDA!", col: '#10b981', a: 1.4 });
          }
          break;
        }
      }
    }

    // Tiros atingem bases e pods
    if (!hit) {
      for (let k = bases.length - 1; k >= 0; k--) {
        const base = bases[k];
        if (base.dying) continue;
        const alivePodsCount = base.pods.filter(p => p.alive).length;
        const isCoreShielded = (alivePodsCount > 0);

        for (let p = 0; p < base.pods.length; p++) {
          const pod = base.pods[p];
          if (!pod.alive) continue;
          if (b.hitTargets && b.hitTargets.includes(pod)) continue;
          const pPos = getPodWorldPos(base, p);
          if (getDist(b.x, b.y, pPos.x, pPos.y) < b.size + 18) {
            b.hitTargets = b.hitTargets || [];
            b.hitTargets.push(pod);
            pod.hp -= b.damage;
            pod.hitFlash = 3;
            playSfx('hit');
            spawnPixelParticles(b.x, b.y, ['#fde047', '#ff2a55'], 6, 0.7);
            floatingTexts.push({ x: pPos.x, y: pPos.y - 14, txt: `${b.damage}`, col: '#fde047', a: 1 });
            hit = true;
            if (b.kind === 'laser_beam') {
              b.pierce = (b.pierce !== undefined ? b.pierce : 3) - 1;
              if (b.pierce > 0) hit = false;
            }

            if (pod.hp <= 0) {
              pod.alive = false;
              playSfx('turretBoom');
              addShake(11);
              spawnPixelParticles(pPos.x, pPos.y, ['#ff2a55', '#fde047', '#ffffff'], 28, 1.4);
              spawnShockwave(pPos.x, pPos.y, '#ff2a55', 55);
              gems.push({ x: pPos.x, y: pPos.y, xp: 4, seed: p, spawnTime: now, sizeMul: 1.4 });
              floatingTexts.push({ x: pPos.x, y: pPos.y - 20, txt: "POD DESTRUIDO!", col: '#fde047', a: 1.4 });

              const remainingPods = base.pods.filter(pd => pd.alive).length;
              if (remainingPods === 0) {
                base.hasShield = false;
                playSfx('warpIn');
                addShake(16);
                spawnShockwave(base.x, base.y, '#fde047', 130);
                floatingTexts.push({ x: base.x, y: base.y - 32, txt: "ESCUDOS CAIRAM! DESTRUA O REATOR!", col: '#ff2a55', a: 2.2 });
                alertText = "! ESCUDOS CAÃRAM - DESTRUA O REATOR !";
                alertTimer = 160;
              }
            }
            break;
          }
        }

        if (!hit && getDist(b.x, b.y, base.x, base.y) < b.size + base.coreR) {
          if (isCoreShielded) {
            playSfx('shieldDeflect');
            spawnShockwave(b.x, b.y, '#38bdf8', 26);
            floatingTexts.push({
              x: base.x, y: base.y - 22,
              txt: "ESCUDO ATIVO!",
              col: '#38bdf8',
              a: 1
            });
            hit = true;
          } else {
            base.coreHp -= b.damage;
            base.coreFlash = 4;
            playSfx('hit');
            spawnPixelParticles(b.x, b.y, ['#ff2a55', '#fde047', '#ffffff'], 8, 0.9);
            floatingTexts.push({
              x: base.x, y: base.y - 22,
              txt: `${b.damage}!`,
              col: '#ff2a55',
              a: 1
            });
            hit = true;
            if (b.kind === 'laser_beam') {
              b.pierce = (b.pierce !== undefined ? b.pierce : 3) - 1;
              if (b.pierce > 0) hit = false;
            }

            if (base.coreHp <= 0) {
              triggerStationCollapse(base);
              break;
            }
          }
        }
        if (hit) break;
      }
    }

    if (hit) {
      triggerBulletDetonation(b);
      bullets.splice(i, 1);
    }
  }

  // --- 10. TIROS DOS INIMIGOS ---
  for (let i = enemyBullets.length - 1; i >= 0; i--) {
    const eb = enemyBullets[i];
    eb.x = wrapCoord(eb.x + eb.vx);
    eb.y = wrapCoord(eb.y + eb.vy);
    eb.range -= Math.hypot(eb.vx, eb.vy);

    const pos = toScreen(eb.x, eb.y);
    ctx.save();
    ctx.translate(pos.x, pos.y);

    if (eb.kind === 'wave_blade') {
      eb.spin = (eb.spin || 0) + (eb.spinSpeed || 0.24);
      ctx.rotate(eb.spin);
      ctx.fillStyle = '#03060c';
      ctx.fillRect(-10, -4, 20, 8);
      ctx.fillRect(-4, -10, 8, 20);
      ctx.fillStyle = eb.color;
      ctx.fillRect(-9, -3, 18, 6);
      ctx.fillStyle = eb.secondaryColor || '#38bdf8';
      ctx.fillRect(-3, -9, 6, 18);
      ctx.fillStyle = eb.coreColor;
      ctx.fillRect(-3, -3, 6, 6);
    } else if (eb.kind === 'beam') {
      ctx.rotate(eb.ang);
      ctx.fillStyle = eb.color;
      ctx.fillRect(-13, -4, 26, 8);
      ctx.fillStyle = eb.coreColor;
      ctx.fillRect(-9, -2, 18, 4);
    } else if (eb.kind === 'plasma') {
      ctx.fillStyle = eb.color;
      ctx.fillRect(-6, -6, 12, 12);
      ctx.fillStyle = eb.coreColor;
      ctx.fillRect(-3, -3, 6, 6);
    } else {
      ctx.fillStyle = eb.color;
      ctx.fillRect(-5, -5, 10, 10);
      ctx.fillStyle = eb.coreColor;
      ctx.fillRect(-2, -2, 4, 4);
    }
    ctx.restore();

    if (getDist(player.x, player.y, eb.x, eb.y) < player.r + eb.size * 0.5) {
      enemyBullets.splice(i, 1);
      damagePlayer(eb.damage);
      if (gameState !== 'PLAYING') return;
      continue;
    }

    if (eb.range <= 0) enemyBullets.splice(i, 1);
  }

  // --- 11. ESTRELAS DE ENERGIA E XP ---
  const MAX_GEM_LIFETIME = 15000;
  for (let i = gems.length - 1; i >= 0; i--) {
    const g = gems[i];
    if (!g.spawnTime) g.spawnTime = now;
    const age = now - g.spawnTime;

    if (age >= MAX_GEM_LIFETIME) {
      spawnPixelParticles(g.x, g.y, ['#38bdf8', '#fde047'], 5, 0.5);
      gems.splice(i, 1);
      continue;
    }

    const d = getDist(player.x, player.y, g.x, g.y);
    if (d < 135) {
      const ang = getAngle(g.x, g.y, player.x, player.y);
      g.x = wrapCoord(g.x + Math.cos(ang) * 5.8);
      g.y = wrapCoord(g.y + Math.sin(ang) * 5.8);
    }

    const pos = toScreen(g.x, g.y);
    if (pos.x > -34 && pos.x < cw + 34 && pos.y > -34 && pos.y < ch + 34) {
      const blinkingOut = (age >= 12000) && (Math.floor(now / 65) % 2 === 0);
      if (!blinkingOut) {
        drawEnergyStar(ctx, pos.x, pos.y, now, g.seed || 0, g.sizeMul || 1.0);
      }
    }

    if (d < player.r + 10 * (g.sizeMul || 1.0)) {
      playSfx('xp');
      const val = g.xp;
      gems.splice(i, 1);
      addPlayerXp(val);
    }
  }

  // --- 12. DRONES ORBITAIS ---
  if (player.orbitals > 0) {
    player.orbitalAngle += 0.06;
    const orbitR = 48;
    for (let i = 0; i < player.orbitals; i++) {
      const ang = player.orbitalAngle + (i * (Math.PI * 2 / player.orbitals));
      const ox = wrapCoord(player.x + Math.cos(ang) * orbitR);
      const oy = wrapCoord(player.y + Math.sin(ang) * orbitR);
      const pos = toScreen(ox, oy);

      if (isOverPlatform(ox, oy)) {
        ctx.drawImage(SPRITES.droneShadow, pos.x + SHADOW_OFFSET_X - SPRITES.droneShadow.width / 2, pos.y + SHADOW_OFFSET_Y - SPRITES.droneShadow.height / 2);
      }
      ctx.drawImage(SPRITES.drone, pos.x - SPRITES.drone.width / 2, pos.y - SPRITES.drone.height / 2);

      enemies.forEach(e => {
        if (getDist(ox, oy, e.x, e.y) < e.r + 8) {
          e.hp -= 2.5;
          e.hitFlash = 2;
        }
      });
      platformTurrets.forEach((pt, ptIdx) => {
        if (pt.alive && getDist(ox, oy, pt.x, pt.y) < pt.r + 8) {
          pt.hp -= 2.5;
          pt.hitFlash = 2;
          if (pt.hp <= 0) {
            pt.alive = false;
            playSfx('turretBoom');
            addShake(11);
            spawnPixelParticles(pt.x, pt.y, ['#10b981', '#38bdf8', '#fde047', '#ffffff'], 32, 1.5);
            spawnShockwave(pt.x, pt.y, '#fde047', 65);
            kills += 2;
            gems.push({ x: pt.x, y: pt.y, xp: 18, seed: ptIdx, spawnTime: now, sizeMul: 1.9 });
            floatingTexts.push({ x: pt.x, y: pt.y - 24, txt: "SUPER ENERGIA +18!", col: '#fde047', a: 1.6 });
          }
        }
      });
    }
  }

  // --- 13. NAVE DO JOGADOR ---
  const px = Math.round(cw / 2 + screenShake.x);
  const py = Math.round(ch / 2 + screenShake.y);

  // Afterimages do Hiper-Impulso / Dash
  player.afterimages.forEach(ai => {
    const pos = toScreen(ai.x, ai.y);
    ctx.save();
    ctx.translate(pos.x, pos.y);
    ctx.globalAlpha = Math.max(0, ai.alpha * 0.70);
    const ghostSpr = ai.isPink ? (SPRITES.playerDashGhostPink || SPRITES.playerDashGhost) : SPRITES.playerDashGhost;
    if (ghostSpr) {
      ctx.drawImage(ghostSpr, -SPRITES.player.width / 2, -SPRITES.player.height / 2);
    }
    ctx.restore();
  });

  if (isOverPlatform(player.x, player.y)) {
    ctx.save();
    ctx.translate(px + SHADOW_OFFSET_X, py + SHADOW_OFFSET_Y);
    ctx.drawImage(SPRITES.playerShadow, -SPRITES.playerShadow.width / 2, -SPRITES.playerShadow.height / 2);
    ctx.restore();
  }

  ctx.save();
  ctx.translate(px, py);

  // Chamas de foguete duplas acopladas aos bocais dos propulsores da nave
  const isMoving = Math.hypot(player.vx, player.vy) > 0.5 || player.dash.active;
  const flameLen = player.dash.active 
    ? Math.round(28 + Math.random() * 16) 
    : (isMoving ? Math.round(10 + Math.random() * 9) : Math.round(4 + Math.random() * 3));

  [-9, 9].forEach(ox => {
    // Camada externa (azul plasma / neon)
    ctx.fillStyle = player.dash.active ? '#38bdf8' : (isMoving ? '#0284c7' : '#0369a1');
    ctx.fillRect(ox - 3, 12, 6, flameLen);
    // Camada mÃ©dia (amarelo brilhante / ciano)
    ctx.fillStyle = player.dash.active ? '#fde047' : (isMoving ? '#38bdf8' : '#38bdf8');
    ctx.fillRect(ox - 2, 12, 4, Math.round(flameLen * 0.72));
    // NÃºcleo branco incandescente
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(ox - 1, 12, 2, Math.round(flameLen * 0.42));
  });

  if (player.hurtFlash > 0) {
    ctx.strokeStyle = (player.hurtFlash % 4 < 2) ? '#ff2a55' : '#ffffff';
    ctx.lineWidth = 3;
    ctx.strokeRect(-22, -22, 44, 44);
  }

  let shipSpr = SPRITES.player;
  if (player.hurtFlash > 0) {
    shipSpr = (player.hurtFlash % 4 < 2) ? SPRITES.playerHitRed : SPRITES.playerHitWhite;
  }
  ctx.drawImage(shipSpr, -shipSpr.width / 2, -SPRITES.player.height / 2);

  // Escudo Aegis com Cargas Defletoras Ativas
  if (player.shieldCharges > 0) {
    const shieldTime = now * 0.0035;
    ctx.save();
    ctx.strokeStyle = '#38bdf8';
    ctx.lineWidth = 2.5;
    ctx.globalAlpha = 0.55 + Math.sin(shieldTime * 3) * 0.25;
    ctx.strokeRect(-24, -24, 48, 48);

    // Cargas energÃ©ticas orbitais ao redor do escudo
    ctx.globalAlpha = 0.95;
    for (let sc = 0; sc < player.shieldCharges; sc++) {
      const chargeAng = shieldTime * 2.2 + (sc * (Math.PI * 2 / player.shieldCharges));
      const cx = Math.cos(chargeAng) * 28;
      const cy = Math.sin(chargeAng) * 28;
      ctx.fillStyle = '#38bdf8';
      ctx.fillRect(cx - 3, cy - 3, 6, 6);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(cx - 1.5, cy - 1.5, 3, 3);
    }
    ctx.restore();
  }

  ctx.restore();

  // --- 14. ONDAS DE CHOQUE, PARTÃCULAS E DANO FLUTUANTE ---
  for (let i = shockwaves.length - 1; i >= 0; i--) {
    const sw = shockwaves[i];
    sw.r += 3.8;
    sw.alpha -= 0.04;
    const pos = toScreen(sw.x, sw.y);
    ctx.strokeStyle = sw.color;
    ctx.globalAlpha = Math.max(0, sw.alpha);
    ctx.lineWidth = 4;
    ctx.strokeRect(pos.x - sw.r, pos.y - sw.r, sw.r * 2, sw.r * 2);
    ctx.globalAlpha = 1.0;
    if (sw.alpha <= 0 || sw.r >= sw.maxR) shockwaves.splice(i, 1);
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x = wrapCoord(p.x + p.vx);
    p.y = wrapCoord(p.y + p.vy);
    p.alpha -= p.decay;
    const pos = toScreen(p.x, p.y);
    ctx.fillStyle = p.color;
    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.fillRect(pos.x - p.size / 2, pos.y - p.size / 2, p.size, p.size);
    ctx.globalAlpha = 1.0;
    if (p.alpha <= 0) particles.splice(i, 1);
  }

  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const f = floatingTexts[i];
    f.y = wrapCoord(f.y - 0.9);
    f.a -= 0.035;
    const pos = toScreen(f.x, f.y);
    ctx.globalAlpha = Math.max(0, Math.min(1, f.a));
    drawPixelText(ctx, f.txt, pos.x, pos.y, 2, f.col || '#ffffff', 'center', '#000000');
    ctx.globalAlpha = 1.0;
    if (f.a <= 0) floatingTexts.splice(i, 1);
  }

  spawnEnemies(now);
  autoShoot(now);
  updateAndDrawSectorCountdown(now);
  drawHUD(now);
}

// InicializaÃ§Ã£o do Jogo
initBiomeWorld();
initStingerPlatforms();
initBases(2);
spawnEnemies(performance.now(), true);
requestAnimationFrame(loop);


  
window.handleAndroidBack = function() {
  if (typeof gameState !== 'undefined') {
    if (gameState === 'PLAYING') {
      gameState = 'PAUSED';
      if (typeof touchStart !== 'undefined') touchStart = null;
      return true;
    } else if (gameState === 'PAUSED' || gameState === 'SETTINGS' || gameState === 'HOWTO') {
      gameState = 'MENU';
      return true;
    }
  }
  return false;
};
</script>
